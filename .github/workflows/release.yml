name: Release

# Tag `vX.Y.Z` → signed AAB + APK, attached to a GitHub Release. The Play upload step runs
# only when a PLAY_JSON_KEY_BASE64 secret exists, so the workflow is useful before Play is set up.
#
# Secrets (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64        the upload keystore, `base64 -i release.jks`
#   KEYSTORE_PASSWORD      keystore password
#   KEY_ALIAS              key alias
#   KEY_PASSWORD           key password
#   PLAY_JSON_KEY_BASE64   (optional) Play Console service-account JSON, `base64 -i key.json`

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (defaults to the tag, or 0.0.0-manual)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Signed build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The version lives in app/build.gradle.kts as a literal — Gradle ignores -PversionName
      # and -PversionCode — so the tag does not set it, it only has to agree with it. Read the
      # version out of the build file and refuse a tag that says something else, rather than
      # publishing a release called v1.2 whose APK reports 1.1.
      - name: Version from build.gradle.kts
        id: version
        run: |
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          if [[ -z "$name" || -z "$code" ]]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts."
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$name" ]]; then
              echo "::error::Tag v$tag does not match versionName \"$name\" in app/build.gradle.kts. Bump the file or retag."
              exit 1
            fi
          fi
          # versionName agreeing with the tag is not enough: Play refuses a versionCode it has
          # already seen, and that is only visible as a rejection at the very last step. The
          # previous tag's code is knowable here, so a code that failed to move is caught before
          # anything is built.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || true)
          if [[ -n "$prev" ]]; then
            prev_code=$(git show "$prev:app/build.gradle.kts" 2>/dev/null \
              | grep -oP 'versionCode\s*=\s*\K[0-9]+' | head -1 || true)
            if [[ -n "$prev_code" && "$code" -le "$prev_code" ]]; then
              echo "::error::versionCode $code is not greater than $prev_code from $prev. Play will reject it."
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The release notes are the same file Play gets: changelogs/<versionCode>.txt, or
          # default.txt when a version has none — so the GitHub Release and the store listing
          # never tell two stories.
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          [[ -f "$notes" ]] || notes="fastlane/metadata/android/en-US/changelogs/default.txt"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "Building $name ($code), notes from $notes"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: bundle exec fastlane android release

      # Signing is the whole point of this workflow, so it is asserted rather than assumed.
      # With no keystore Gradle does not fail — it writes app-release-unsigned.apk and carries
      # on, which would otherwise sail through to the GitHub Release and the Play upload.
      - name: Verify the artifacts are signed
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          if (( ${#apks[@]} != 1 || ${#aabs[@]} != 1 )); then
            echo "::error::Expected exactly one APK and one AAB; got ${#apks[@]} and ${#aabs[@]}."
            exit 1
          fi
          apk="${apks[0]}"; aab="${aabs[0]}"

          # Gradle renames an unsigned APK to app-release-unsigned.apk. An unsigned BUNDLE keeps
          # its name, so this is only a cheap first pass, not the check.
          for f in "$apk" "$aab"; do
            if [[ "$f" == *unsigned* ]]; then
              echo "::error::Unsigned artifact: $f"; exit 1
            fi
          done

          # The APK can only be judged by apksigner. minSdk is 28, so AGP signs v2/v3 and skips
          # v1 entirely: a correctly signed APK carries NOTHING in META-INF, and looking there
          # would reject every real release. apksigner reads the APK Signing Block, understands
          # every scheme, and exits non-zero when there is no signature at all.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk"

          # A bundle is a jar and really is JAR-signed, so META-INF is the right place to look for
          # it. The listing is captured first rather than piped into grep: grep -q exits at the
          # first match, unzip takes SIGPIPE, and under pipefail that reads as failure on a bundle
          # that is in fact signed. jarsigner is no help here — plain -verify exits 0 on an
          # unsigned jar, and -strict fails a self-signed upload key on chainNotValidated.
          listing=$(unzip -l "$aab")
          if ! grep -qiE 'META-INF/.*\.(RSA|DSA|EC)$' <<<"$listing"; then
            echo "::error::No signature block in $aab — built without the release keystore."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrtpulse-release-${{ steps.version.outputs.name }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Restore Play service account
        if: env.PLAY_JSON_KEY_BASE64 != '' && startsWith(github.ref, 'refs/tags/v')
        run: echo "$PLAY_JSON_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/play.json"

      - name: Play production track
        if: env.PLAY_JSON_KEY_BASE64 != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_JSON_KEY_FILE: ${{ runner.temp }}/play.json
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: bundle exec fastlane android production

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The changelog first, GitHub's generated commit list after it.
          body_path: ${{ steps.version.outputs.notes }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Scrub secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play.json"
