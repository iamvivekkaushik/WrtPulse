name: Release

# Tag `vX.Y.Z` → signed AAB + APK, attached to a GitHub Release. The Play upload step runs
# only when a PLAY_JSON_KEY_BASE64 secret exists, so the workflow is useful before Play is set up.
#
# Secrets (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64        the upload keystore, `base64 -i release.jks`
#   KEYSTORE_PASSWORD      keystore password
#   KEY_ALIAS              key alias
#   KEY_PASSWORD           key password
#   PLAY_JSON_KEY_BASE64   (optional) Play Console service-account JSON, `base64 -i key.json`

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (defaults to the tag, or 0.0.0-manual)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Signed build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version_name || '0.0.0-manual' }}" >> "$GITHUB_OUTPUT"
          fi
          # Monotonic across every run, which is all Play requires of versionCode.
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: bundle exec fastlane android release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrtpulse-release-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Restore Play service account
        if: env.PLAY_JSON_KEY_BASE64 != '' && startsWith(github.ref, 'refs/tags/v')
        run: echo "$PLAY_JSON_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/play.json"

      - name: Play internal track
        if: env.PLAY_JSON_KEY_BASE64 != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_JSON_KEY_FILE: ${{ runner.temp }}/play.json
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: bundle exec fastlane android beta

      - name: Scrub secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play.json"
